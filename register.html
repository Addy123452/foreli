<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#08090d">
  <title>Create account — Foreli</title>
  <meta name="description" content="Create your Foreli account and start anticipating your day.">
  <link rel="stylesheet" href="assets/css/auth.css">
</head>
<body class="auth-page">
  <div class="auth-glow"></div>
  <main class="auth-card">
    <a class="auth-brand" href="index.html">foreli<span>.</span></a>
    <h1 class="auth-title">Create your account</h1>
    <p class="auth-sub">Start anticipating what's coming.</p>

    <form data-auth-mode="register" novalidate>
      <div class="auth-error" id="authError" role="alert" hidden></div>

      <div class="field">
        <label for="register-email">Email</label>
        <input id="register-email" type="email" name="email" autocomplete="email"
               placeholder="you@example.com" required>
      </div>

      <div class="field">
        <label for="register-password">Password</label>
        <span class="password-wrap">
          <input id="register-password" type="password" name="password"
                 autocomplete="new-password" placeholder="At least 8 characters" required>
          <button type="button" class="toggle-pw" data-toggle-password
                  aria-label="Show password">Show</button>
        </span>
      </div>

      <div class="field">
        <label for="register-confirm">Confirm password</label>
        <span class="password-wrap">
          <input id="register-confirm" type="password" name="confirm"
                 autocomplete="new-password" placeholder="Repeat your password" required>
          <button type="button" class="toggle-pw" data-toggle-password
                  aria-label="Show password">Show</button>
        </span>
      </div>

      <div class="auth-actions">
        <button type="submit" class="btn btn-primary">Create account</button>
      </div>
    </form>

    <p class="auth-switch">Already have an account? <a href="login.html">Sign in</a></p>
  </main>

  <script src="assets/js/config.js"></script>
  <script src="assets/js/auth.js"></script>
</body>
</html>
